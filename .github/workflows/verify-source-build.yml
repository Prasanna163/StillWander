name: Verify source build

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Still Wander from authored source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p source/1.21.11 clean build --no-daemon --console=plain

      - name: Compare source build with published JAR contents
        shell: python
        run: |
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          properties = {}
          for line in Path('source/1.21.11/gradle.properties').read_text(encoding='utf-8').splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key, value = line.split('=', 1)
                  properties[key.strip()] = value.strip()

          artifact = f"{properties['archives_base_name']}-{properties['mod_version']}.jar"
          published = Path('versions') / artifact
          built = Path('source/1.21.11/build/libs') / artifact
          if not published.is_file():
              raise SystemExit(f'Missing published release artifact: {published}')
          if not built.is_file():
              raise SystemExit(f'Missing source-built artifact: {built}')

          def files(path: Path) -> dict[str, bytes]:
              with ZipFile(path) as jar:
                  return {
                      name: jar.read(name)
                      for name in jar.namelist()
                      if not name.endswith('/')
                  }

          expected = files(published)
          actual = files(built)
          names = sorted(set(expected) | set(actual))
          mismatches = [
              name for name in names
              if name not in expected
              or name not in actual
              or expected[name] != actual[name]
          ]

          print(f'Published files: {len(expected)}')
          print(f'Source-build files: {len(actual)}')
          print(f'Content differences: {len(mismatches)}')
          print(f'Published SHA-256: {sha256(published.read_bytes()).hexdigest().upper()}')
          print(f'Source-build SHA-256: {sha256(built.read_bytes()).hexdigest().upper()}')

          if mismatches:
              print('Mismatched or missing entries:')
              for name in mismatches:
                  print(f'  {name}')
              raise SystemExit(1)

          print('PASS: every file loaded from the source-built JAR is byte-for-byte identical.')
