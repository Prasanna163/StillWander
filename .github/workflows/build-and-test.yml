name: Build and test

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'source/1.21.11/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'source/1.21.11/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests and build Still Wander
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p source/1.21.11 clean test build --no-daemon --console=plain
