name: Source / binary authentication audit

on:
  push:
    paths:
      - '.github/workflows/source-binary-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Recover historical baseline and verify its cryptographic hash
        shell: bash
        run: |
          set -euo pipefail
          git show fde823d0dce0a105a1b95461f796b73d00e1e746:vendor/cinecraft-1.1.1+1.21.11.jar > /tmp/cinecraft-baseline.jar
          echo '16D35350387917DA9CDACB8D4E96DB54E6DA3DB548032575974D767C78300C25  /tmp/cinecraft-baseline.jar' | sha256sum -c -

      - name: Download the same CFR version used for source recovery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar \
            --output /tmp/cfr.jar

      - name: Reproduce the recovered source from the historical binary
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/baseline-decompiled
          java -jar /tmp/cfr.jar /tmp/cinecraft-baseline.jar \
            --outputdir /tmp/baseline-decompiled \
            --silent true

      - name: Decompile all published Still Wander JARs for direct comparison
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/release-decompiled
          mkdir -p /tmp/release-decompiled
          for jar in versions/*.jar; do
            name="$(basename "$jar" .jar)"
            mkdir -p "/tmp/release-decompiled/$name"
            java -jar /tmp/cfr.jar "$jar" \
              --outputdir "/tmp/release-decompiled/$name" \
              --silent true
          done

      - name: Generate authentication report
        shell: bash
        env:
          AUDIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import re
          import struct
          import zipfile
          from pathlib import Path

          REPO = Path('.')
          BASELINE = Path('/tmp/cinecraft-baseline.jar')
          BASELINE_SRC = Path('/tmp/baseline-decompiled/com/cinecraft')
          SOURCE = REPO / 'src/main/java/com/cinecraft'
          DECOMPILED_ROOT = Path('/tmp/release-decompiled')
          REPORT = REPO / 'SOURCE_BINARY_AUDIT.md'
          BASELINE_COMMIT = 'fde823d0dce0a105a1b95461f796b73d00e1e746'
          BASELINE_SHA256 = '16D35350387917DA9CDACB8D4E96DB54E6DA3DB548032575974D767C78300C25'
          AUDIT_COMMIT = os.environ.get('AUDIT_COMMIT', 'unknown')

          brand_replacements = {
              b'Cinecraft Settings': b'Still Wander Settings',
              b'CINECRAFT DIRECTOR': b'STILL WANDER DIRECTOR',
              b'Cinecraft cinematic camera': b'Still Wander cinematic camera',
              b'key.cinecraft.toggle_cinematic': b'key.stillwander.toggle_cinematic',
              b'key.cinecraft.open_settings': b'key.stillwander.open_settings',
              b'key.cinecraft.toggle_recording': b'key.stillwander.toggle_recording',
              b'key.cinecraft.toggle_debug': b'key.stillwander.toggle_debug',
              b'key.cinecraft.next_shot': b'key.stillwander.next_shot',
              b'cinecraft.json': b'stillwander.json',
              b'cinecraft-\x01.csv': b'stillwander-\x01.csv',
              b'cinecraft': b'stillwander',
          }
          brand_reverse_text = {
              v.decode('utf-8', errors='ignore'): k.decode('utf-8', errors='ignore')
              for k, v in brand_replacements.items()
              if b'\x01' not in k and b'\x01' not in v
          }
          brand_patch_classes = {
              'com/cinecraft/CinecraftClient.class',
              'com/cinecraft/capture/CinematicRecorder.class',
              'com/cinecraft/config/CinecraftConfig.class',
              'com/cinecraft/config/CinecraftSettingsScreen.class',
              'com/cinecraft/debug/CinecraftDebugHud.class',
              'com/cinecraft/compat/CinecraftFlawlessFrames.class',
          }

          def sha256_path(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest().upper()

          def java_files(root: Path):
              return {p.relative_to(root).as_posix(): p for p in root.rglob('*.java')}

          def strip_cfr_header(text: str) -> str:
              # CFR prepends a decompiler/missing-class block comment. It is not executable source.
              return re.sub(r'^/\*.*?\*/\s*', '', text, count=1, flags=re.S)

          def normalize_source_text(text: str, reverse_brand: bool = False) -> str:
              text = text.replace('\r\n', '\n').replace('\r', '\n')
              text = strip_cfr_header(text)
              if reverse_brand:
                  for new, old in brand_reverse_text.items():
                      text = text.replace(new, old)
              return '\n'.join(line.rstrip() for line in text.split('\n')).strip() + '\n'

          def class_entries(jar: Path):
              with zipfile.ZipFile(jar) as z:
                  return {
                      n: z.read(n)
                      for n in z.namelist()
                      if n.startswith('com/cinecraft/') and n.endswith('.class')
                  }

          def rewrite_class_utf8(data: bytes, replacements: dict[bytes, bytes]) -> bytes:
              if data[:4] != b'\xCA\xFE\xBA\xBE':
                  raise ValueError('Not a Java class file')
              out = bytearray()
              out += data[:8]
              pos = 8
              cp_count = struct.unpack('>H', data[pos:pos+2])[0]
              out += data[pos:pos+2]
              pos += 2
              i = 1
              while i < cp_count:
                  tag = data[pos]
                  out.append(tag)
                  pos += 1
                  if tag == 1:
                      length = struct.unpack('>H', data[pos:pos+2])[0]
                      pos += 2
                      raw = data[pos:pos+length]
                      pos += length
                      repl = replacements.get(raw, raw)
                      out += struct.pack('>H', len(repl))
                      out += repl
                  elif tag in (3, 4):
                      out += data[pos:pos+4]; pos += 4
                  elif tag in (5, 6):
                      out += data[pos:pos+8]; pos += 8
                      i += 1
                  elif tag in (7, 8, 16, 19, 20):
                      out += data[pos:pos+2]; pos += 2
                  elif tag in (9, 10, 11, 12, 17, 18):
                      out += data[pos:pos+4]; pos += 4
                  elif tag == 15:
                      out += data[pos:pos+3]; pos += 3
                  else:
                      raise ValueError(f'Unsupported constant-pool tag {tag}')
                  i += 1
              out += data[pos:]
              return bytes(out)

          # 1. Current recovered source must reproduce exactly from the historical binary with CFR 0.152.
          current_src = java_files(SOURCE)
          baseline_src = java_files(BASELINE_SRC)
          source_union = sorted(set(current_src) | set(baseline_src))
          source_exact = []
          source_mismatch = []
          for rel in source_union:
              a = current_src.get(rel)
              b = baseline_src.get(rel)
              if a and b and a.read_bytes() == b.read_bytes():
                  source_exact.append(rel)
              else:
                  source_mismatch.append(rel)

          # 2. Compare 1.21.11 release runtime classes to the historical binary after applying
          #    the exact branding-only class constant-pool rewrite documented in the original build.gradle.
          baseline_classes = class_entries(BASELINE)
          ref_jar = REPO / 'versions/stillwander-1.0.0+1.21.11.jar'
          ref_classes = class_entries(ref_jar)
          expected_ref = {}
          for name, data in baseline_classes.items():
              expected_ref[name] = rewrite_class_utf8(data, brand_replacements) if name in brand_patch_classes else data

          ref_union = sorted(set(expected_ref) | set(ref_classes))
          ref_exact = []
          ref_mismatch = []
          for name in ref_union:
              if name in expected_ref and name in ref_classes and expected_ref[name] == ref_classes[name]:
                  ref_exact.append(name)
              else:
                  ref_mismatch.append(name)

          # 3. Compare every published release JAR's project runtime classes to the authenticated 1.21.11 runtime.
          jar_rows = []
          for jar in sorted((REPO / 'versions').glob('*.jar')):
              classes = class_entries(jar)
              names = sorted(set(classes) | set(ref_classes))
              exact = sum(1 for n in names if n in classes and n in ref_classes and classes[n] == ref_classes[n])
              mismatched = [n for n in names if not (n in classes and n in ref_classes and classes[n] == ref_classes[n])]

              # Direct decompiled-source comparison. We strip only the CFR header and undo public branding strings.
              # No Minecraft-version identifier normalization is performed, so this is deliberately strict.
              decomp_dir = DECOMPILED_ROOT / jar.stem / 'com/cinecraft'
              decomp = java_files(decomp_dir) if decomp_dir.exists() else {}
              java_union = sorted(set(current_src) | set(decomp))
              decomp_exact = 0
              decomp_mismatch = []
              for rel in java_union:
                  a = current_src.get(rel)
                  b = decomp.get(rel)
                  if not a or not b:
                      decomp_mismatch.append(rel)
                      continue
                  ta = normalize_source_text(a.read_text(encoding='utf-8', errors='replace'), reverse_brand=False)
                  tb = normalize_source_text(b.read_text(encoding='utf-8', errors='replace'), reverse_brand=True)
                  if ta == tb:
                      decomp_exact += 1
                  else:
                      decomp_mismatch.append(rel)

              jar_rows.append({
                  'name': jar.name,
                  'sha256': sha256_path(jar),
                  'size': jar.stat().st_size,
                  'class_count': len(classes),
                  'class_exact': exact,
                  'class_union': len(names),
                  'class_mismatch_count': len(mismatched),
                  'class_mismatch_examples': mismatched[:8],
                  'source_exact': decomp_exact,
                  'source_union': len(java_union),
                  'source_mismatch_count': len(decomp_mismatch),
                  'source_mismatch_examples': decomp_mismatch[:8],
              })

          # 4. Read original build.gradle directly from history to hash the historical build recipe.
          #    The workflow shell independently verifies the baseline SHA before this report is generated.
          import subprocess
          historical_build = subprocess.check_output([
              'git', 'show', f'{BASELINE_COMMIT}:build.gradle'
          ])
          historical_build_sha = hashlib.sha256(historical_build).hexdigest().upper()

          source_repro_ok = (
              len(source_mismatch) == 0
              and len(current_src) == len(baseline_src)
              and len(current_src) > 0
          )
          ref_bytecode_ok = (
              len(ref_mismatch) == 0
              and len(ref_classes) == len(expected_ref)
              and len(ref_classes) > 0
          )

          lines = []
          lines += [
              '# Source / binary authentication audit',
              '',
              f'**Audit input commit:** `{AUDIT_COMMIT}`  ',
              f'**Historical baseline commit:** `{BASELINE_COMMIT}`  ',
              f'**Historical baseline JAR SHA-256:** `{BASELINE_SHA256}`  ',
              f'**Historical build.gradle SHA-256:** `{historical_build_sha}`  ',
              '**Decompiler used for reproducibility check:** CFR `0.152`',
              '',
              '## Verdict',
              '',
          ]

          if source_repro_ok:
              lines.append(f'- **Recovered source reproducibility: PASS.** All **{len(current_src)} / {len(current_src)}** committed Java files are byte-for-byte identical to a fresh CFR 0.152 decompilation of the repository\'s cryptographically verified historical Cinecraft 1.1.1 JAR.')
          else:
              lines.append(f'- **Recovered source reproducibility: FAIL.** Exact files: {len(source_exact)}; mismatches/missing: {len(source_mismatch)}.')

          if ref_bytecode_ok:
              lines.append(f'- **Still Wander 1.0.0 + Minecraft 1.21.11 runtime-bytecode lineage: PASS.** All **{len(ref_classes)} / {len(ref_classes)}** project class files match the historical Cinecraft binary exactly after applying only the explicit branding constant-pool substitutions documented in the original `build.gradle`.')
          else:
              lines.append(f'- **Still Wander 1.0.0 + Minecraft 1.21.11 runtime-bytecode lineage: FAIL.** Exact class files: {len(ref_exact)}; mismatches/missing: {len(ref_mismatch)}.')

          all_release_exact = all(r['class_mismatch_count'] == 0 and r['class_union'] == len(ref_classes) for r in jar_rows)
          if all_release_exact:
              lines.append('- **All published version JAR runtime classes are byte-for-byte identical to the authenticated 1.21.11 Still Wander runtime classes.** Differences between full JAR hashes therefore reside outside the project runtime class payload, such as version/resource metadata.')
          else:
              lines.append('- **The published version JARs are not all byte-for-byte identical at the project-class level.** The per-version table below reports the exact class-byte match count. No claim of byte-for-byte identity is made for a version whose count is below the total.')

          lines += [
              '',
              '### What “exact” means here',
              '',
              'There are two different questions, and this audit keeps them separate:',
              '',
              '1. **Source reconstruction exactness:** whether the committed readable `.java` tree is exactly reproducible from the preserved binary using the same decompiler version. This is a byte-for-byte file comparison.',
              '2. **Release runtime exactness:** whether the compiled project `.class` files in a release JAR are byte-for-byte the same as the authenticated baseline, allowing only the branding string substitutions explicitly performed by the historical build recipe.',
              '',
              'This does **not** claim that CFR recovered the original handwritten comments, formatting, or original local-variable names. Those source-level details are not present in Java bytecode. The repository source is an exact reproducible **decompilation of the preserved implementation**, not a claim that decompiled formatting is the lost original authoring text.',
              '',
              '## Evidence chain',
              '',
              f'1. Git history contains `vendor/cinecraft-1.1.1+1.21.11.jar` at commit `{BASELINE_COMMIT}`.',
              f'2. Its SHA-256 is independently checked as `{BASELINE_SHA256}` before any comparison runs.',
              '3. The historical `build.gradle` names that JAR as `legacyBaseline`, extracts its `com/cinecraft/**/*.class` runtime implementation, rewrites only a defined list of branding strings in six classes, and packages those classes into Still Wander.',
              '4. The present `src/main/java/com/cinecraft/` tree is regenerated from that exact binary with CFR 0.152 and compared file-for-file.',
              '5. The 1.21.11 Still Wander JAR is compared class-for-class against the historical baseline after reproducing the historical branding rewrite at the Java class-file constant-pool level.',
              '6. Every published version JAR is hashed in full and its `com/cinecraft/**/*.class` payload is compared byte-for-byte with the authenticated 1.21.11 runtime payload.',
              '',
              '## Recovered source reproducibility',
              '',
              f'- committed Java files: **{len(current_src)}**',
              f'- freshly decompiled Java files: **{len(baseline_src)}**',
              f'- byte-for-byte identical files: **{len(source_exact)}**',
              f'- mismatched or missing files: **{len(source_mismatch)}**',
          ]
          if source_mismatch:
              lines.append('- mismatch examples: ' + ', '.join(f'`{x}`' for x in source_mismatch[:10]))

          lines += [
              '',
              '## Authenticated 1.21.11 runtime-bytecode comparison',
              '',
              f'- historical baseline project classes: **{len(baseline_classes)}**',
              f'- Still Wander 1.21.11 project classes: **{len(ref_classes)}**',
              f'- exact expected class matches after documented branding substitution: **{len(ref_exact)}**',
              f'- mismatched or missing classes: **{len(ref_mismatch)}**',
          ]
          if ref_mismatch:
              lines.append('- mismatch examples: ' + ', '.join(f'`{x}`' for x in ref_mismatch[:10]))

          lines += [
              '',
              '## Published JAR inventory and exact comparisons',
              '',
              '| Published JAR | SHA-256 | Bytes | Project classes | Exact class bytes vs 1.21.11 | Strict decompiled Java match vs recovered source* |',
              '| --- | --- | ---: | ---: | ---: | ---: |',
          ]
          for r in jar_rows:
              lines.append(
                  f"| `{r['name']}` | `{r['sha256']}` | {r['size']} | {r['class_count']} | "
                  f"{r['class_exact']}/{r['class_union']} | {r['source_exact']}/{r['source_union']} |"
              )

          lines += [
              '',
              '\*The strict Java comparison removes only the CFR header comment and reverses the documented Still-Wander branding strings. It deliberately does **not** normalize Minecraft-version-specific class/method/field identifiers. A result below 100% therefore means the source text is not byte-for-byte equivalent after those limited normalizations; it must not be described as exact source identity for that version.',
              '',
              '## Per-version mismatch notes',
              '',
          ]
          for r in jar_rows:
              lines.append(f"### `{r['name']}`")
              lines.append('')
              if r['class_mismatch_count'] == 0:
                  lines.append('- project class payload vs 1.21.11: **exact byte-for-byte match**')
              else:
                  lines.append(f"- project class mismatches/missing vs 1.21.11: **{r['class_mismatch_count']}**")
                  if r['class_mismatch_examples']:
                      lines.append('- examples: ' + ', '.join(f"`{x}`" for x in r['class_mismatch_examples']))
              if r['source_mismatch_count'] == 0:
                  lines.append('- strict decompiled Java vs recovered source: **exact match after branding reversal/header removal**')
              else:
                  lines.append(f"- strict decompiled Java mismatches/missing: **{r['source_mismatch_count']}**")
                  if r['source_mismatch_examples']:
                      lines.append('- examples: ' + ', '.join(f"`{x}`" for x in r['source_mismatch_examples']))
              lines.append('')

          lines += [
              '## Relevant repository locations',
              '',
              '- Recovered source: `src/main/java/com/cinecraft/`',
              '- Source provenance: `SOURCE_PROVENANCE.md`',
              '- Published JARs: `versions/`',
              f'- Historical release commit: `{BASELINE_COMMIT}`',
              '- Historical build recipe: `build.gradle` at the historical release commit',
              '- Reproducibility workflow: `.github/workflows/restore-cinecraft-source.yml`',
              '- This audit workflow: `.github/workflows/source-binary-audit.yml`',
              '',
              '---',
              '',
              'This report is generated from repository contents and Git history by deterministic hash, decompilation, class-file and byte comparisons. It intentionally distinguishes cryptographically/bytewise verified facts from claims that Java bytecode cannot support.',
          ]

          REPORT.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(REPORT.read_text(encoding='utf-8'))

          # Fail the workflow if the two core authentication checks fail.
          if not source_repro_ok or not ref_bytecode_ok:
              raise SystemExit('Core source/binary authentication check failed')
          PY

      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_BINARY_AUDIT.md
          if git diff --cached --quiet; then
            echo 'Audit report unchanged.'
            exit 0
          fi
          git commit -m 'Add source and binary authentication report'
          git push origin HEAD:main
