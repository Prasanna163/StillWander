name: Bug report
description: Report a reproducible Still Wander problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove account details, tokens, and private server addresses from logs before attaching them.
  - type: input
    id: version
    attributes:
      label: Still Wander version
      placeholder: 1.0.0+1.21.11
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft, Fabric Loader, Fabric API, and Java versions
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other installed mods
      description: Include rendering, camera, Dynamic FPS, Replay Mod, and shader-related mods.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      render: text
