plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def legacyBaseline = file('vendor/cinecraft-1.1.1+1.21.11.jar')
def legacyRuntimeClasses = layout.buildDirectory.dir('generated/legacy-runtime-classes')
def brandedBaseline = layout.buildDirectory.dir('generated/branded-baseline')
def brandReplacements = [
        'Cinecraft Settings': 'Still Wander Settings',
        'CINECRAFT DIRECTOR': 'STILL WANDER DIRECTOR',
        'Cinecraft cinematic camera': 'Still Wander cinematic camera',
        'key.cinecraft.toggle_cinematic': 'key.stillwander.toggle_cinematic',
        'key.cinecraft.open_settings': 'key.stillwander.open_settings',
        'key.cinecraft.toggle_recording': 'key.stillwander.toggle_recording',
        'key.cinecraft.toggle_debug': 'key.stillwander.toggle_debug',
        'key.cinecraft.next_shot': 'key.stillwander.next_shot',
        'cinecraft.json': 'stillwander.json',
        'cinecraft-\u0001.csv': 'stillwander-\u0001.csv',
        'cinecraft': 'stillwander'
]
def brandPatchClasses = [
        'com/cinecraft/CinecraftClient.class',
        'com/cinecraft/capture/CinematicRecorder.class',
        'com/cinecraft/config/CinecraftConfig.class',
        'com/cinecraft/config/CinecraftSettingsScreen.class',
        'com/cinecraft/debug/CinecraftDebugHud.class',
        'com/cinecraft/compat/CinecraftFlawlessFrames.class'
]

static byte[] rewriteClassUtf8(byte[] input, Map<String, String> replacements) {
    def source = new DataInputStream(new ByteArrayInputStream(input))
    def bytes = new ByteArrayOutputStream(input.length + 64)
    def target = new DataOutputStream(bytes)

    target.writeInt(source.readInt())
    target.writeShort(source.readUnsignedShort())
    target.writeShort(source.readUnsignedShort())
    int constantPoolCount = source.readUnsignedShort()
    target.writeShort(constantPoolCount)

    for (int index = 1; index < constantPoolCount; index++) {
        int tag = source.readUnsignedByte()
        target.writeByte(tag)
        switch (tag) {
            case 1:
                int length = source.readUnsignedShort()
                byte[] original = source.readNBytes(length)
                String value = new String(original, java.nio.charset.StandardCharsets.UTF_8)
                byte[] replacement = replacements.getOrDefault(value, value)
                        .getBytes(java.nio.charset.StandardCharsets.UTF_8)
                target.writeShort(replacement.length)
                target.write(replacement)
                break
            case 3:
            case 4:
                target.write(source.readNBytes(4))
                break
            case 5:
            case 6:
                target.write(source.readNBytes(8))
                index++
                break
            case 7:
            case 8:
            case 16:
            case 19:
            case 20:
                target.write(source.readNBytes(2))
                break
            case 9:
            case 10:
            case 11:
            case 12:
            case 17:
            case 18:
                target.write(source.readNBytes(4))
                break
            case 15:
                target.write(source.readNBytes(3))
                break
            default:
                throw new GradleException("Unsupported class constant-pool tag: ${tag}")
        }
    }
    source.transferTo(target)
    target.flush()
    return bytes.toByteArray()
}

tasks.register('extractLegacyRuntimeClasses', Sync) {
    from({
        def remappedLegacy = configurations.clientCompileClasspath.files.find {
            it.name.startsWith('cinecraft-1.1.1+1.21.11') && it.name.endsWith('.jar')
        }
        if (remappedLegacy == null) throw new GradleException('Loom did not provide the remapped 1.1.1 client JAR')
        zipTree(remappedLegacy)
    }) {
        include 'com/cinecraft/**/*.class'
    }
    into legacyRuntimeClasses
    doLast {
        brandPatchClasses.each { relativePath ->
            File classFile = legacyRuntimeClasses.get().file(relativePath).asFile
            classFile.bytes = rewriteClassUtf8(classFile.bytes, brandReplacements)
        }
    }
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods {
        'stillwander' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets.client.output.dir(legacyRuntimeClasses, builtBy: tasks.named('extractLegacyRuntimeClasses'))

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly files(legacyBaseline)
}

tasks.named('remapJar').configure {
    archiveClassifier = 'development'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

tasks.register('prepareBrandedBaseline', Sync) {
    from({ zipTree(legacyBaseline) }) {
        exclude 'fabric.mod.json'
        exclude 'assets/cinecraft/lang/en_us.json'
        exclude 'cinecraft.mixins.json'
    }
    into brandedBaseline
    doLast {
        brandPatchClasses.each { relativePath ->
            File classFile = brandedBaseline.get().file(relativePath).asFile
            classFile.bytes = rewriteClassUtf8(classFile.bytes, brandReplacements)
        }
    }
}

tasks.register('mergeLegacyJar', Zip) {
    dependsOn tasks.named('processResources'), tasks.named('prepareBrandedBaseline')
    archiveFileName = "${project.archives_base_name}-${project.version}.jar"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(brandedBaseline)
    from(layout.buildDirectory.dir('resources/main')) {
        include 'fabric.mod.json'
        include 'stillwander.mixins.json'
        include 'assets/stillwander/lang/en_us.json'
        include 'assets/stillwander/icon.png'
    }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('mergeLegacyJar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
